name: Signed macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  unsigned-package-smoke:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: node scripts/build/verify-release-version.mjs "$RELEASE_TAG"
      - name: Seal the production release feed into the unsigned smoke build
        run: node scripts/build/configure-update-feed.mjs "$GITHUB_REPOSITORY"
      - name: Build and exercise an unsigned package without release secrets
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run package:mac
          npm run verify:package
          npm run smoke:package

  release:
    needs: unsigned-package-smoke
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: node scripts/build/verify-release-version.mjs "$RELEASE_TAG"
      - name: Seal the production release feed into the signed app
        run: node scripts/build/configure-update-feed.mjs "$GITHUB_REPOSITORY"
      - run: npm run qa
      - run: npm run qa:release-readiness
      - run: npm run test:visual
      - name: Sign, notarize, and staple release artifacts
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APP_BUILDER_TMP_DIR: ${{ runner.temp }}/grokbuild-signing
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f -- "$key_file"' EXIT
          mkdir -m 700 "$APP_BUILDER_TMP_DIR"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_file"
          export APPLE_API_KEY="$key_file"
          npm run package:mac
          dmg="dist/GrokBuild-Electron-${RELEASE_TAG#v}-arm64.dmg"
          codesign --force --sign "$MAC_SIGN_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
      - name: Remove signing credentials and temporary keychains
        if: always()
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          signing_dir="$RUNNER_TEMP/grokbuild-signing"
          test "$signing_dir" = "${RUNNER_TEMP}/grokbuild-signing"
          if [ -d "$signing_dir" ]; then
            while IFS= read -r -d '' keychain; do
              security delete-keychain "$keychain" >/dev/null 2>&1 || true
            done < <(/usr/bin/find "$signing_dir" -type f -name '*.keychain' -print0)
            rm -rf -- "$signing_dir"
          fi
          rm -f -- "$RUNNER_TEMP/AuthKey.p8"
          test ! -e "$RUNNER_TEMP/AuthKey.p8"
          test ! -e "$signing_dir"
      - name: Create exact signed app update asset
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/mac-arm64/GrokBuild.app" \
            "dist/GrokBuild-Electron-${RELEASE_TAG}.app.zip"
          cd dist
          shasum -a 256 "GrokBuild-Electron-${RELEASE_TAG}.app.zip" "GrokBuild-Electron-${RELEASE_TAG#v}-arm64.dmg" > SHA256SUMS
      - name: Verify signed release artifacts
        env:
          GROKBUILD_REQUIRE_SIGNED: '1'
          GROKBUILD_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run verify:package -- \
            "dist/mac-arm64/GrokBuild.app" \
            "dist/GrokBuild-Electron-${RELEASE_TAG#v}-arm64.dmg" \
            "dist/GrokBuild-Electron-${RELEASE_TAG}.app.zip" \
            "dist/SHA256SUMS"
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd dist
            shasum -a 256 -c SHA256SUMS
          )
          gh release create "$RELEASE_TAG" \
            "dist/GrokBuild-Electron-${RELEASE_TAG}.app.zip" \
            "dist/GrokBuild-Electron-${RELEASE_TAG#v}-arm64.dmg" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "${RELEASE_TAG} (Notarized)" \
            --notes "Signed and notarized GrokBuild Electron macOS release. Verify SHA256SUMS before installation."
