name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-qa:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run qa
      - run: npm run test:visual
      - run: git diff --exit-code -- qa/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: qa-failures
          path: |
            test-results
            playwright-report

  package-shape:
    needs: deterministic-qa
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run verify:package
      - run: npm run smoke:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grokbuild-electron-unsigned-arm64
          path: dist/GrokBuild-Electron-*.dmg
